# =========================
# OPENWA - HTTP
# =========================
server {
    listen 80;
    server_name openwa.abrahamkonany.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# =========================
# OPENWA - HTTPS
# (add this block only once the certificate exists, see deploy/README.md)
# =========================
server {
    listen 443 ssl;
    server_name openwa.abrahamkonany.com;

    ssl_certificate /etc/letsencrypt/live/openwa.abrahamkonany.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openwa.abrahamkonany.com/privkey.pem;

    # Media uploads: must be >= OpenWA's BODY_SIZE_LIMIT (25mb by default).
    client_max_body_size 30m;

    # Resolve openwa-api through Docker's DNS at request time: a literal upstream host makes the
    # shared nginx refuse to (re)start whenever the openwa-api container does not exist.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $openwa_upstream http://openwa-api:2785;

    location / {
        proxy_pass $openwa_upstream;
        proxy_http_version 1.1;

        # API, dashboard and Socket.IO share this port: keep WebSocket upgrades working.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
